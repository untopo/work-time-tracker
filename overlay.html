<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Time Tracker Overlay</title>
    <script src="assets/js/storage.js"></script>
    <script>
        try {
            const savedTheme = window.WTTStorage ? window.WTTStorage.getItem('theme') : localStorage.getItem('theme');
            const shouldUseDark = savedTheme === 'dark'
                || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches);
            document.documentElement.classList.toggle('dark', shouldUseDark);
        } catch (error) {}
    </script>
    <link rel="stylesheet" href="assets/css/desktop-overlay.css">
</head>
<body>
    <div class="overlay-shell">
        <div class="overlay-panel">
            <div class="overlay-titlebar">
                <div class="overlay-drag-handle" data-tauri-drag-region aria-label="Move overlay"></div>
                <div class="overlay-window-actions">
                    <button id="overlay-minimize-btn" type="button" class="overlay-window-btn" aria-label="Hide overlay" title="Hide overlay">-</button>
                    <button id="overlay-close-btn" type="button" class="overlay-window-btn overlay-window-btn-close" aria-label="Disable overlay" title="Disable overlay">x</button>
                </div>
            </div>

            <div id="overlay-info-card" class="overlay-info-card" data-mode="idle">
                <div id="overlay-status-text" class="overlay-status-text">Select Rate</div>
                <div id="overlay-rate-name" class="overlay-rate-name">Open the main app and choose a rate.</div>
                <div id="overlay-timer" class="overlay-timer" style="display:none;">00:00:00</div>
                <div id="overlay-earnings" class="overlay-earnings" style="display:none;">$0.00</div>
            </div>

            <button id="overlay-primary-btn" type="button" class="overlay-primary-btn" aria-label="Overlay Action" title="Overlay Action">
                <span id="overlay-primary-icon" class="overlay-primary-icon">&#9654;</span>
            </button>
        </div>
    </div>

    <script type="module" src="assets/js/desktop-overlay.js"></script>
</body>
</html>
