<!DOCTYPE html>
<html lang="en" class="">
<head>
    <!-- existing head content -->
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors">
    <!-- existing body content -->
    
    <script>
        // Utility functions
        const formatMoney = (amount) => `$${Number(amount).toFixed(2)}`;
        const isSameDay = (date1, date2) => {
            const dateObject1 = new Date(date1);
            const dateObject2 = new Date(date2);
            return dateObject1.getFullYear() === dateObject2.getFullYear() &&
                   dateObject1.getMonth() === dateObject2.getMonth() &&
                   dateObject1.getDate() === dateObject2.getDate();
        };

        function filterCallsByDate(calls, targetDate) {
            if (!targetDate) return calls;
            
            const target = new Date(targetDate);
            target.setHours(0, 0, 0, 0);
            
            return calls.filter(call => {
                const callDate = new Date(call.date);
                return callDate.getFullYear() === target.getFullYear() &&
                       callDate.getMonth() === target.getMonth() &&
                       callDate.getDate() === target.getDate();
            });
        }

        const formatDuration = (totalSeconds) => {
            const hours = Math.floor(totalSeconds / 3600);
            const mins = Math.floor((totalSeconds % 3600) / 60);
            const secs = Math.floor(totalSeconds % 60);
            return `${String(hours).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        };

        const sanitizeHTML = (str) => {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        };

        // Dark mode toggle
        const darkToggle = document.getElementById('dark-toggle');
        if (darkToggle) {
            darkToggle.addEventListener('click', () => {
                document.documentElement.classList.toggle('dark');
                localStorage.setItem('darkMode', document.documentElement.classList.contains('dark'));
            });

            // Initialize dark mode from localStorage
            if (localStorage.getItem('darkMode') === 'true') {
                document.documentElement.classList.add('dark');
            }
        }

        // State management
        let rates = JSON.parse(localStorage.getItem('rates')) || [];
        let activeTimers = new Set(); // Track all active timers
        let calls = JSON.parse(localStorage.getItem('calls')) || [];
        let currentCall = null;
        let callTimer = null;
        let editingCallIndex = null;
        let goal = parseFloat(localStorage.getItem('goal')) || 0;

        // Initialize date picker with today's local date
        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        let selectedDate = now.toISOString().split('T')[0];

        // DOM elements - cached for performance
        const modalTitle = document.getElementById('modal-title');
        const settingsToggle = document.getElementById('settings-toggle');
        const settingsModal = document.getElementById('settings-modal');
        const closeSettingsModal = document.getElementById('close-settings-modal');
        const exportDataBtn = document.getElementById('export-data');
        const importFileInput = document.getElementById('import-file');
        const cleanupDataBtn = document.getElementById('cleanup-data');
        const storageUsed = document.getElementById('storage-used');
        const storageBar = document.getElementById('storage-bar');
        const ratesList = document.getElementById('rates-list');
        const rateForm = document.getElementById('rate-form');
        const rateName = document.getElementById('rate-name');
        const rateAmount = document.getElementById('rate-amount');
        const showRateAdd = document.getElementById('show-rate-add');
        const cancelRateAdd = document.getElementById('cancel-rate-add');
        const callLog = document.getElementById('call-log');
        const startCallBtn = document.getElementById('start-call-btn');
        const endCallBtn = document.getElementById('end-call-btn');
        const addCallBtn = document.getElementById('add-call-btn');
        const callModal = document.getElementById('call-modal');
        const callForm = document.getElementById('call-form');
        const closeModalBtn = document.getElementById('close-modal');
        const cancelCall = document.getElementById('cancel-call');
        const callDate = document.getElementById('call-date');
        const callRate = document.getElementById('call-rate');
        const liveCallInfo = document.getElementById('live-call-info');
        const liveCallTimer = document.getElementById('live-call-timer');
        const liveCallEarnings = document.getElementById('live-call-earnings');
        const goalForm = document.getElementById('goal-form');
        const goalAmount = document.getElementById('goal-amount');
        const goalProgressBar = document.getElementById('goal-progress-bar');
        const goalProgressText = document.getElementById('goal-progress-text');
        const goalAmountDisplay = document.getElementById('goal-amount-display');
        const totalMinutes = document.getElementById('total-minutes');
        const totalEarnings = document.getElementById('total-earnings');
        const statsDatePicker = document.getElementById('stats-date-picker');
        const currentDateBtn = document.getElementById('current-date-btn');
        const dailyTotalEarnings = document.getElementById('daily-total-earnings');
        const avgDuration = document.getElementById('avg-duration');

        // Initialize goal amount display
        if (goalAmount) {
            goalAmount.value = goal || '';
        }

        // Initialize date picker
        if (statsDatePicker) {
            statsDatePicker.value = selectedDate;
            statsDatePicker.addEventListener('change', (e) => {
                selectedDate = e.target.value;
                displayCalls();
                updateStatistics();
            });
        }

        if (currentDateBtn) {
            currentDateBtn.addEventListener('click', () => {
                const now = new Date();
                now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
                const today = now.toISOString().split('T')[0];
                if (statsDatePicker) {
                    statsDatePicker.value = today;
                }
                selectedDate = today;
                displayCalls();
                updateStatistics();
            });
        }

        // Rate management
        function displayRates() {
            if (!ratesList) return;
            
            ratesList.innerHTML = rates.map((rate, index) => `
                <div class="rates-list-item">
                    <div class="flex-1">
                        <span class="font-medium">${sanitizeHTML(rate.name)}</span>
                        <span class="text-gray-600 dark:text-gray-400"> - ${formatMoney(rate.amount)}/min</span>
                    </div>
                    <button onclick="deleteRate(${index})" class="text-red-500 hover:text-red-700">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
            `).join('');
            
            // Update rate options in call modal
            if (callRate) {
                callRate.innerHTML = rates.map((rate, index) => 
                    `<option value="${index}">${sanitizeHTML(rate.name)} (${formatMoney(rate.amount)}/min)</option>`
                ).join('');
            }
            
            // Update live call rate selector
            const liveCallRate = document.getElementById('live-call-rate');
            if (liveCallRate) {
                const currentValue = liveCallRate.value;
                liveCallRate.innerHTML = rates.map((rate, index) => 
                    `<option value="${index}" class="bg-white dark:bg-gray-800">${sanitizeHTML(rate.name)} (${formatMoney(rate.amount)}/min)</option>`
                ).join('');
                // Preserve selected value if it still exists in rates
                if (rates.some((_, index) => index.toString() === currentValue)) {
                    liveCallRate.value = currentValue;
                }
            }
            localStorage.setItem('rates', JSON.stringify(rates));
        }

        function deleteRate(index) {
            // Check if rate is being used by existing calls
            const isRateInUse = calls.some(call => call.rateIndex === index);
            if (isRateInUse) {
                if (!confirm('This rate is being used by existing calls. Deleting it may affect call display. Continue?')) {
                    return;
                }
            }
            
            rates.splice(index, 1);
            
            // Update call indices to prevent broken references
            calls.forEach(call => {
                if (call.rateIndex > index) {
                    call.rateIndex--;
                }
            });
            
            localStorage.setItem('calls', JSON.stringify(calls));
            displayRates();
            displayCalls();
        }

        // Rate form handlers
        if (showRateAdd) {
            showRateAdd.addEventListener('click', () => {
                if (rateForm) {
                    rateForm.style.display = 'block';
                    showRateAdd.style.display = 'none';
                    if (rateName) rateName.focus();
                }
            });
        }

        if (cancelRateAdd) {
            cancelRateAdd.addEventListener('click', () => {
                if (rateForm && showRateAdd) {
                    rateForm.style.display = 'none';
                    showRateAdd.style.display = 'flex';
                    rateForm.reset();
                }
            });
        }

        if (rateForm) {
            rateForm.addEventListener('submit', (e) => {
                e.preventDefault();
                if (rateName && rateAmount) {
                    const name = rateName.value.trim();
                    const amount = parseFloat(rateAmount.value);

                    // Validate rate name
                    if (!name) {
                        alert('Rate name cannot be empty');
                        return;
                    }
                    if (name.length > 50) {
                        alert('Rate name is too long (maximum 50 characters)');
                        return;
                    }

                    // Validate rate amount
                    if (isNaN(amount) || !isFinite(amount)) {
                        alert('Please enter a valid number for the rate amount');
                        return;
                    }
                    if (amount <= 0) {
                        alert('Rate amount must be greater than 0');
                        return;
                    }
                    if (amount > 999999) {
                        alert('Rate amount is too high (maximum 999,999)');
                        return;
                    }

                    rates.push({
                        name: name,
                        amount: amount
                    });
                    displayRates();
                    rateForm.style.display = 'none';
                    if (showRateAdd) {
                        showRateAdd.style.display = 'flex';
                    }
                    rateForm.reset();
                }
            });
        }

        // Call management
        function deleteCall(index) {
            if (confirm('Are you sure you want to delete this call?')) {
                calls.splice(index, 1);
                localStorage.setItem('calls', JSON.stringify(calls));
                displayCalls();
                updateStatistics();
            }
        }

        function editCall(index) {
            const call = calls[index];
            if (!call) return;

            editingCallIndex = index;
            const date = new Date(call.date);
            
            if (modalTitle) modalTitle.textContent = 'Edit Call';
            if (callDate) callDate.value = getLocalISOString(date);
            
            const hours = Math.floor(call.duration / 3600);
            const minutes = Math.floor((call.duration % 3600) / 60);
            const seconds = call.duration % 60;
            
            const hoursInput = document.getElementById('call-duration-hours');
            const minutesInput = document.getElementById('call-duration-minutes');
            const secondsInput = document.getElementById('call-duration-seconds');
            
            if (hoursInput) hoursInput.value = hours;
            if (minutesInput) minutesInput.value = minutes;
            if (secondsInput) secondsInput.value = seconds;
            if (callRate) callRate.value = call.rateIndex;
            
            lastActiveElement = document.activeElement;
            if (callModal) {
                callModal.style.display = 'flex';
                if (callDate) callDate.focus();
            }
        }

        function addCallToLog(date, duration, rateIndex) {
            // Create a new Date object in local time
            const callDate = new Date(date);
            
            // Create ISO string that preserves local time
            const year = callDate.getFullYear();
            const month = String(callDate.getMonth() + 1).padStart(2, '0');
            const day = String(callDate.getDate()).padStart(2, '0');
            const hours = String(callDate.getHours()).padStart(2, '0');
            const minutes = String(callDate.getMinutes()).padStart(2, '0');
            const seconds = String(callDate.getSeconds()).padStart(2, '0');
            const localDate = `${year}-${month}-${day}T${hours}:${minutes}:${seconds}`;

            calls.push({
                date: localDate,
                duration: duration,
                rateIndex: rateIndex
            });
            
            localStorage.setItem('calls', JSON.stringify(calls));
            displayCalls();
            updateStatistics();
        }

        function displayCalls() {
            if (!callLog) return;
            
            // Sort filtered calls by date
            let displayedCalls = filterCallsByDate(calls, selectedDate);
            displayedCalls.sort((a, b) => new Date(b.date) - new Date(a.date));
            
            callLog.innerHTML = displayedCalls.map((call, index) => {
                const rate = rates[call.rateIndex];
                if (!rate) return '';
                
                const duration = call.duration;
                const minutes = duration / 60; // Convert seconds to minutes
                const earned = rate.amount * minutes; // Multiply per-minute rate by minutes
                
                return `
                    <tr>
                        <td>${new Date(call.date).toLocaleString()}</td>
                        <td>${formatDuration(duration)}</td>
                        <td>${sanitizeHTML(rate.name)} (${formatMoney(rate.amount)}/min)</td>
                        <td>${formatMoney(earned)}</td>
                        <td class="pl-4">
                            <div class="flex gap-2">
                                <button onclick="editCall(${calls.indexOf(call)})" class="text-blue-500 hover:text-blue-700">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button onclick="deleteCall(${calls.indexOf(call)})" class="text-red-500 hover:text-red-700">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');

            updateTotals();
            localStorage.setItem('calls', JSON.stringify(calls));
        }
        
        // Call timer functionality
        function updateCallTimer() {
            if (!currentCall) return;
    
            const duration = Math.floor((Date.now() - currentCall.startTime) / 1000);
            const rate = rates[currentCall.rateIndex];
            if (!rate) return;
            
            const minutes = duration / 60; // Convert seconds to minutes
            const earned = rate.amount * minutes; // Multiply per-minute rate by minutes
            
            if (liveCallTimer) liveCallTimer.textContent = formatDuration(duration);
            if (liveCallEarnings) liveCallEarnings.textContent = `${formatMoney(earned)} earned`;
            updateTotals();
        }

        if (startCallBtn) {
            startCallBtn.addEventListener('click', () => {
                if (rates.length === 0) {
                    alert('Please add at least one rate before starting a call.');
                    return;
                }

                // Clear any existing timers first
                activeTimers.forEach(timerId => clearInterval(timerId));
                activeTimers.clear();

                const liveCallRate = document.getElementById('live-call-rate');
                currentCall = {
                    startTime: Date.now(),
                    rateIndex: liveCallRate ? parseInt(liveCallRate.value) : 0
                };

                startCallBtn.disabled = true;
                if (endCallBtn) endCallBtn.disabled = false;
                if (liveCallInfo) liveCallInfo.style.display = 'block';
                const newTimer = setInterval(updateCallTimer, 1000);
                activeTimers.add(newTimer);
                callTimer = newTimer;
            });
        }

        if (endCallBtn) {
            endCallBtn.addEventListener('click', () => {
                if (!currentCall) return;

                const duration = Math.floor((Date.now() - currentCall.startTime) / 1000);
                
                // Add call with current time
                addCallToLog(new Date(), duration, currentCall.rateIndex);

                // Clear timers and reset state
                activeTimers.forEach(timerId => clearInterval(timerId));
                activeTimers.clear();
                callTimer = null;
                currentCall = null;
                if (startCallBtn) startCallBtn.disabled = false;
                endCallBtn.disabled = true;
                if (liveCallInfo) liveCallInfo.style.display = 'none';
                displayCalls();
                updateStatistics();
            });
        }

        // Modal keyboard handler
        function handleModalKeyboard(event) {
            if (event.key === 'Escape') {
                closeModal();
            }
            
            if (event.key === 'Tab') {
                // Only handle tab if modal is visible
                if (callModal && callModal.style.display === 'flex') {
                    const focusable = callModal.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
                    const firstFocusable = focusable[0];
                    const lastFocusable = focusable[focusable.length - 1];

                    // If shift+tab and first element is focused, move to last
                    if (event.shiftKey && document.activeElement === firstFocusable) {
                        event.preventDefault();
                        lastFocusable.focus();
                    }
                    // If tab and last element is focused, move to first
                    else if (!event.shiftKey && document.activeElement === lastFocusable) {
                        event.preventDefault();
                        firstFocusable.focus();
                    }
                }
            }
        }

                        // Settings keyboard handler
                function handleSettingsKeyboard(e) {
                    if (!settingsModal || settingsModal.style.display === 'none') return;

                    if (e.key === 'Escape') {
                        settingsModal.style.display = 'none';
                        if (settingsToggle) settingsToggle.focus();
                        return;
                    }

                    if (e.key === 'Tab') {
                        const modalFocusableElements = settingsModal.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
                        const firstFocusable = modalFocusableElements[0];
                        const lastFocusable = modalFocusableElements[modalFocusableElements.length - 1];

                        // If shift+tab and first element is focused, move to last
                        if (e.shiftKey && document.activeElement === firstFocusable) {
                            e.preventDefault();
                            lastFocusable.focus();
                        }
                        // If tab and last element is focused, move to first
                        else if (!e.shiftKey && document.activeElement === lastFocusable) {
                            e.preventDefault();
                            firstFocusable.focus();
                        }
                    }
                }

                // Modal close function
                function closeModal() {
                    if (callModal) {
                        callModal.style.display = 'none';
                    }
                    if (callForm) {
                        callForm.reset();
                    }
                    editingCallIndex = null;
                    if (modalTitle) {
                        modalTitle.textContent = 'Add Call';
                    }
                    // Return focus to last active element
                    if (lastActiveElement) {
                        lastActiveElement.focus();
                    }
                }

                // Call modal functionality
                if (addCallBtn) {
                    addCallBtn.addEventListener('click', () => {
                        if (rates.length === 0) {
                            alert('Please add at least one rate before adding a call.');
                            return;
                        }
                        editingCallIndex = null;
                        if (modalTitle) modalTitle.textContent = 'Add Call';
                        if (callForm) callForm.reset();
                        const now = new Date();
                        if (callDate) callDate.value = getLocalISOString(now);
                        
                        // Store last active element and show modal
                        lastActiveElement = document.activeElement;
                        if (callModal) {
                            callModal.style.display = 'flex';
                            // Focus first input after modal is shown
                            const firstInput = callModal.querySelector('input');
                            if (firstInput) firstInput.focus();
                        }
                    });
                }

                if (closeModalBtn) {
                    closeModalBtn.addEventListener('click', () => {
                        closeModal();
                    });
                }

                if (cancelCall) {
                    cancelCall.addEventListener('click', () => {
                        closeModal();
                    });
                }

                // Call form submit handler
                if (callForm) {
                    callForm.addEventListener('submit', (e) => {
                        e.preventDefault();
                        
                        const hoursInput = document.getElementById('call-duration-hours');
                        const minutesInput = document.getElementById('call-duration-minutes');
                        const secondsInput = document.getElementById('call-duration-seconds');
                        
                        const hours = parseInt(hoursInput.value) || 0;
                        const minutes = parseInt(minutesInput.value) || 0;
                        const seconds = parseInt(secondsInput.value) || 0;
                        
                        const totalSeconds = (hours * 3600) + (minutes * 60) + seconds;
                        
                        if (totalSeconds <= 0) {
                            alert('Please enter a valid duration');
                            return;
                        }
                        
                        const inputDate = new Date(callDate.value);
                        
                        if (editingCallIndex !== null) {
                            calls[editingCallIndex] = {
                                date: inputDate.toISOString(),
                                duration: totalSeconds,
                                rateIndex: parseInt(callRate.value)
                            };
                            localStorage.setItem('calls', JSON.stringify(calls));
                        } else {
                            addCallToLog(inputDate, totalSeconds, parseInt(callRate.value));
                        }
                        
                        closeModal();
                        displayCalls();
                        updateStatistics();
                    });
                }

                // Click outside modal to close
                if (callModal) {
                    callModal.addEventListener('click', (e) => {
                        if (e.target === callModal) {
                            closeModal();
                        }
                    });
                }

                // Settings modal functionality
                if (settingsToggle) {
                    settingsToggle.addEventListener('click', () => {
                        if (settingsModal) {
                            settingsModal.style.display = 'flex';
                            updateStorageInfo();
                            // Focus first button when modal opens
                            const firstButton = settingsModal.querySelector('button');
                            if (firstButton) firstButton.focus();
                        }
                    });
                }

                // Click outside settings modal to close
                if (settingsModal) {
                    settingsModal.addEventListener('click', (e) => {
                        if (e.target === settingsModal) {
                            settingsModal.style.display = 'none';
                            if (settingsToggle) settingsToggle.focus();
                        }
                    });
                }

                // Add keyboard event listeners for both modals
                document.addEventListener('keydown', (e) => {
                    if (callModal && callModal.style.display === 'flex') {
                        handleModalKeyboard(e);
                    } else if (settingsModal && settingsModal.style.display === 'flex') {
                        handleSettingsKeyboard(e);
                    }
                });

                // Initialize displays and add event listeners
                displayRates();
                displayCalls();
                updateStatistics();
                updateStorageInfo();

                // Cleanup on page unload
                window.addEventListener('beforeunload', () => {
                    activeTimers.forEach(timerId => clearInterval(timerId));
                    activeTimers.clear();
                });
            </script>
        </body>
    </html>
