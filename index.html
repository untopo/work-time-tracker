<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Time Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#10b981',
                        dark: '#1e293b',
                        light: '#f8fafc'
                    }
                }
            }
        }
    </script>
    <style>
        .time-input {
            width: 80px;
        }
        .amount-input {
            width: 100px;
        }
        .scrollable-table {
            max-height: 400px;
            overflow-y: auto;
        }
        .highlight-cell {
            background-color: rgba(16, 185, 129, 0.2);
        }
        .summary-card {
            transition: all 0.3s ease;
        }
        .summary-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="bg-gray-50">
    <div class="container mx-auto px-4 py-8">
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-dark mb-2">Work Time Tracker</h1>
            <p class="text-gray-600">Track your work hours and earnings</p>
        </header>

        <!-- Call Tracker App -->
        <div id="call-tracker-app" class="mb-8">
            <h2 class="text-xl font-semibold mb-4 text-dark">
                Call Log for
                <input type="date" id="date-picker" class="border rounded px-2 py-1"/>
            </h2>
            <div class="space-x-2 mb-4">
                <button id="add-call-btn" class="bg-primary text-white px-4 py-2 rounded hover:bg-blue-600 transition">Add Call</button>
                <button id="start-call-btn" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600 transition">Start Call</button>
                <button id="end-call-btn" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600 transition">End Call</button>
            </div>
            <div class="scrollable-table">
                <table border="1" cellpadding="5" class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th>Start</th>
                            <th>End</th>
                            <th>Minutes</th>
                            <th>Rate</th>
                            <th>Earnings</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="call-list"></tbody>
                    <tfoot>
                        <tr>
                            <td colspan="2"><b>Total</b></td>
                            <td id="total-minutes">0</td>
                            <td></td>
                            <td id="total-earnings">$0.00</td>
                            <td></td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>
        <!-- Modal for Add/Edit Call -->
        <div id="call-modal" style="display:none;position:fixed;top:20%;left:50%;transform:translateX(-50%);background:#fff;border:1px solid #333;padding:20px;z-index:999;">
            <h3 class="text-lg font-semibold mb-2">Add/Edit Call</h3>
            <form id="call-form">
                <label>Date:
                    <input type="date" id="call-date" required class="border rounded px-2 py-1"/>
                </label>
                <br>
                <label>Start Time:
                    <input type="time" id="call-start" class="border rounded px-2 py-1"/>
                </label>
                <br>
                <label>End Time:
                    <input type="time" id="call-end" class="border rounded px-2 py-1"/>
                </label>
                <br>
                <label>OR Minutes:
                    <input type="number" id="call-minutes" min="1" class="border rounded px-2 py-1"/>
                </label>
                <br>
                <label>Rate:
                    <select id="call-rate" class="border rounded px-2 py-1"></select>
                </label>
                <br><br>
                <button type="submit" class="bg-primary text-white px-4 py-2 rounded hover:bg-blue-600 transition">Save</button>
                <button type="button" id="cancel-call-btn" class="bg-gray-300 px-4 py-2 rounded hover:bg-gray-400 transition ml-2">Cancel</button>
            </form>
        </div>
    </div>
    <script>
    // --- Data Model and Helper Functions ---
    function getData() {
        const data = localStorage.getItem('workTimeTracker');
        if (data) {
            return JSON.parse(data);
        } else {
            const initial = {
                rates: [
                    { id: 'fl', name: 'FL', rate: 0.21 },
                    { id: 'ds', name: 'DS', rate: 0.10 },
                ],
                calls: {} // date (YYYY-MM-DD) : [ { id, start, end, minutes, rateId } ]
            };
            localStorage.setItem('workTimeTracker', JSON.stringify(initial));
            return initial;
        }
    }
    function saveData(data) {
        localStorage.setItem('workTimeTracker', JSON.stringify(data));
    }
    function getTodayKey() {
        const now = new Date();
        return now.toISOString().slice(0,10);
    }
    function makeCallId() {
        return 'call-' + Math.random().toString(36).substr(2,9);
    }
    function getCallsForDate(dateKey) {
        const data = getData();
        return data.calls[dateKey] || [];
    }
    function setCallsForDate(dateKey, callList) {
        const data = getData();
        data.calls[dateKey] = callList;
        saveData(data);
    }
    function getRates() {
        return getData().rates;
    }
    function addRate(name, rate) {
        const data = getData();
        const newRate = {
            id: 'rate-' + Math.random().toString(36).substr(2,9),
            name,
            rate: parseFloat(rate)
        };
        data.rates.push(newRate);
        saveData(data);
        return newRate;
    }
    function editRate(rateId, name, rate) {
        const data = getData();
        const idx = data.rates.findIndex(r => r.id === rateId);
        if (idx !== -1) {
            data.rates[idx].name = name;
            data.rates[idx].rate = parseFloat(rate);
            saveData(data);
        }
    }
    function deleteRate(rateId) {
        const data = getData();
        data.rates = data.rates.filter(r => r.id !== rateId);
        saveData(data);
    }
    function timeStrToMinutes(t) {
        if (!t) return null;
        const [h, m] = t.split(':').map(Number);
        return h * 60 + m;
    }
    function minutesToTimeStr(mins) {
        if (typeof mins !== 'number' || isNaN(mins)) return '';
        const h = Math.floor(mins / 60);
        const m = mins % 60;
        return `${h}:${m.toString().padStart(2, '0')}`;
    }
    function durationBetween(start, end) {
        if (!start || !end) return null;
        let startM = timeStrToMinutes(start);
        let endM = timeStrToMinutes(end);
        let diff = endM - startM;
        if (diff < 0) diff += 24 * 60;
        return diff;
    }
    // --- UI and Logic for Call Log ---
    function renderCallList(dateKey) {
        const callList = getCallsForDate(dateKey);
        const rates = getRates();
        const tbody = document.getElementById('call-list');
        tbody.innerHTML = '';
        let totalMinutes = 0;
        let totalEarnings = 0;

        callList.forEach((call, idx) => {
            const rate = rates.find(r => r.id === call.rateId) || {name: "?", rate: 0};
            const minutes = call.minutes !== undefined && call.minutes !== null
                ? call.minutes
                : durationBetween(call.start, call.end);
            const earning = minutes * rate.rate;
            totalMinutes += minutes || 0;
            totalEarnings += earning || 0;

            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${call.start || ''}</td>
                <td>${call.end || ''}</td>
                <td>${minutes || ''}</td>
                <td>${rate.name} ($${rate.rate.toFixed(2)})</td>
                <td>$${earning ? earning.toFixed(2) : ''}</td>
                <td>
                    <button onclick="editCall('${dateKey}','${call.id}')" class="bg-yellow-400 px-2 py-1 rounded mr-1">Edit</button>
                    <button onclick="deleteCall('${dateKey}','${call.id}')" class="bg-red-400 px-2 py-1 rounded">Delete</button>
                </td>
            `;
            tbody.appendChild(row);
        });
        document.getElementById('total-minutes').textContent = totalMinutes;
        document.getElementById('total-earnings').textContent = "$" + totalEarnings.toFixed(2);
    }
    // Fill rates in the add/edit form
    function fillRateOptions() {
        const rateSel = document.getElementById('call-rate');
        rateSel.innerHTML = '';
        getRates().forEach(r => {
            const opt = document.createElement('option');
            opt.value = r.id;
            opt.textContent = `${r.name} ($${r.rate.toFixed(2)}/min)`;
            rateSel.appendChild(opt);
        });
    }
    // Open add/edit call modal
    function openCallModal(dateKey, call) {
        fillRateOptions();
        document.getElementById('call-modal').style.display = '';
        document.getElementById('call-date').value = dateKey || getTodayKey();
        document.getElementById('call-start').value = call?.start || '';
        document.getElementById('call-end').value = call?.end || '';
        document.getElementById('call-minutes').value = call?.minutes || '';
        document.getElementById('call-rate').value = call?.rateId || getRates()[0].id;
        document.getElementById('call-form').dataset.editing = call ? call.id : '';
    }
    // Close modal
    function closeCallModal() {
        document.getElementById('call-modal').style.display = 'none';
    }
    // Add or Edit call
    document.getElementById('call-form').onsubmit = function(e) {
        e.preventDefault();
        const dateKey = document.getElementById('call-date').value;
        let start = document.getElementById('call-start').value;
        let end = document.getElementById('call-end').value;
        let minutes = parseInt(document.getElementById('call-minutes').value, 10);
        if (!minutes && start && end) {
            minutes = durationBetween(start, end);
        }
        const rateId = document.getElementById('call-rate').value;
        if (!minutes || minutes < 1) {
            alert("Enter valid times or minutes!");
            return;
        }
        const calls = getCallsForDate(dateKey);
        const editingId = this.dataset.editing;
        if (editingId) {
            // Edit existing call
            const idx = calls.findIndex(c => c.id === editingId);
            if (idx !== -1) {
                calls[idx] = { id: editingId, start, end, minutes, rateId };
            }
        } else {
            // Add new call
            calls.push({
                id: makeCallId(),
                start,
                end,
                minutes,
                rateId
            });
        }
        setCallsForDate(dateKey, calls);
        closeCallModal();
        renderCallList(document.getElementById('date-picker').value);
    };
    // Cancel button
    document.getElementById('cancel-call-btn').onclick = closeCallModal;
    // "Add Call" button
    document.getElementById('add-call-btn').onclick = function() {
        openCallModal(document.getElementById('date-picker').value || getTodayKey());
    };
    // Edit call
    window.editCall = function(dateKey, callId) {
        const calls = getCallsForDate(dateKey);
        const call = calls.find(c => c.id === callId);
        if (call) openCallModal(dateKey, call);
    };
    // Delete call
    window.deleteCall = function(dateKey, callId) {
        if (!confirm("Delete this call?")) return;
        const calls = getCallsForDate(dateKey).filter(c => c.id !== callId);
        setCallsForDate(dateKey, calls);
        renderCallList(dateKey);
    };
    // Date picker logic
    const datePicker = document.getElementById('date-picker');
    datePicker.value = getTodayKey();
    datePicker.onchange = function() {
        renderCallList(this.value);
    };
    // Start Call button
    document.getElementById('start-call-btn').onclick = function() {
        const dateKey = document.getElementById('date-picker').value || getTodayKey();
        const now = new Date();
        const timeStr = now.toTimeString().slice(0,5);
        const rates = getRates();
        const defaultRate = rates.length > 0 ? rates[0].id : null;
        if (!defaultRate) {
            alert("Please set up at least one rate first!");
            return;
        }
        const calls = getCallsForDate(dateKey);
        calls.push({
            id: makeCallId(),
            start: timeStr,
            end: '',
            minutes: null,
            rateId: defaultRate
        });
        setCallsForDate(dateKey, calls);
        renderCallList(dateKey);
    };
    // End Call button
    document.getElementById('end-call-btn').onclick = function() {
        const dateKey = document.getElementById('date-picker').value || getTodayKey();
        const now = new Date();
        const timeStr = now.toTimeString().slice(0,5);
        const calls = getCallsForDate(dateKey);
        for (let i = calls.length - 1; i >= 0; i--) {
            if (calls[i].start && !calls[i].end) {
                calls[i].end = timeStr;
                const mins = durationBetween(calls[i].start, calls[i].end);
                calls[i].minutes = mins;
                setCallsForDate(dateKey, calls);
                renderCallList(dateKey);
                return;
            }
        }
        alert("No call found to end! Start a call first.");
    };
        // --- Start/End Call Button Logic ---

document.getElementById('start-call-btn').onclick = function() {
    const dateKey = document.getElementById('date-picker').value || getTodayKey();
    const now = new Date();
    const timeStr = now.toTimeString().slice(0,5); // "HH:MM"
    const rates = getRates();
    const defaultRate = rates.length > 0 ? rates[0].id : null;
    if (!defaultRate) {
        alert("Please set up at least one rate first!");
        return;
    }
    // Add a new call entry with only start time
    const calls = getCallsForDate(dateKey);
    calls.push({
        id: makeCallId(),
        start: timeStr,
        end: '',
        minutes: null,
        rateId: defaultRate
    });
    setCallsForDate(dateKey, calls);
    renderCallList(dateKey);
};

document.getElementById('end-call-btn').onclick = function() {
    const dateKey = document.getElementById('date-picker').value || getTodayKey();
    const now = new Date();
    const timeStr = now.toTimeString().slice(0,5); // "HH:MM"
    const calls = getCallsForDate(dateKey);
    // Find the last call without an end time
    for (let i = calls.length - 1; i >= 0; i--) {
        if (calls[i].start && !calls[i].end) {
            calls[i].end = timeStr;
            // Calculate minutes
            const mins = durationBetween(calls[i].start, calls[i].end);
            calls[i].minutes = mins;
            setCallsForDate(dateKey, calls);
            renderCallList(dateKey);
            return;
        }
    }
    alert("No call found to end! Start a call first.");
};
    // Initial render
    renderCallList(getTodayKey());
    </script>
</body>
</html>
