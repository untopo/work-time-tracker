name: Checks

# Fast verification for every pull request and every push to main: version
# sync across the six version locations, release readiness, JS syntax, and
# the web build, and end-to-end data-safety tests. The heavy installer builds live in build-release.yml.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Version and release checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Version sync
        run: npm run verify:version-sync

      - name: Release readiness
        run: npm run verify:release-ready

      - name: Icons present in trimmed Font Awesome
        run: npm run verify:icons

      - name: JavaScript syntax
        run: |
          node --check assets/js/app.js
          node --check assets/js/data-core.js
          node --check assets/js/session-core.js
          node --check assets/js/progress-core.js
          node --check assets/js/metrics-core.js

      - name: Unit tests (data logic)
        run: npm run test:unit

      - name: Web build
        run: npm run build:web

      # Opens the real app in Chromium and checks that saved data survives,
      # calls are recorded and every screen opens. Network is blocked inside
      # the tests, so no analytics are ever sent.
      - name: Install Chromium for end-to-end tests
        run: npx playwright-core install --with-deps chromium

      - name: End-to-end data safety tests
        run: npm run test:e2e
