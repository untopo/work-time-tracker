[package]
name = "work_time_tracker"
version = "1.2.3"
description = "Privacy-first time tracker for interpreters and freelancers."
authors = ["Topo"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "work_time_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
rfd = "0.15"
tauri = { version = "2.10.0", features = [] }
tauri-plugin-log = "2"
url = "2.5"
